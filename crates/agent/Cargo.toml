[package]
name = "zk-pof-agent"
version.workspace = true
edition.workspace = true

[dependencies]
zk-pof-common = { workspace = true }
alloy = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SP1 host-side SDK (for ZK proof generation)
# v6 required for riscv64 ELF support (current SP1 toolchain produces 64-bit ELFs)
# 'blocking' feature provides synchronous API; 'network' disabled to avoid extra deps
sp1-sdk = { version = "6", default-features = false, features = ["blocking"] }

# Database (SQLite for dev)
rusqlite = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

# URL parsing (for RPC fetcher)
url = "2"

# HTTP client (for webhook delivery)
reqwest = { workspace = true }

# MPT verification (host-side port of program/src/mpt.rs)
tiny-keccak = { workspace = true }
alloy-rlp = { version = "0.3", default-features = false }

# Secret-key handling in zkpof-client: hidden TTY entry + memory wiping, so a
# key never reaches argv, shell history, or a core dump.
zeroize = "1"
rpassword = "7"

[dev-dependencies]
# alloy with node-bindings for spawning Anvil in integration tests
# node-bindings is NOT included in alloy's "full" feature
alloy = { workspace = true, features = ["node-bindings"] }
sha2 = { workspace = true }
