[package]
name = "zk-pof-program"
version = "0.1.0"
edition = "2021"

# This crate compiles to RISC-V for SP1 execution.
# Build with: cd program && cargo prove build

[dependencies]
# SP1 zkVM guest library — provides io::read/commit and entrypoint macro
sp1-zkvm = "6"

# Hashing (SP1 has SHA-256 precompile for performance)
sha2 = "0.10"

# Serialization for reading inputs
serde = { version = "1", features = ["derive"] }

# MPT verification (Phase 2) — keccak256 for Ethereum state trie, RLP decoding for proof nodes
tiny-keccak = { version = "2", features = ["keccak"] }
alloy-rlp = { version = "0.3", default-features = false }

# Standalone: not part of the root workspace (also listed in its `exclude`).
# The explicit empty table keeps `cargo prove build` working even when the
# checkout is nested inside another workspace (e.g. git worktrees).
[workspace]
